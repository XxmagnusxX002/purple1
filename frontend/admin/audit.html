<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Auditoría | Purple One Admin</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-admin-page="audit" data-admin-title="Auditoría">
    <div class="admin-shell" id="admin-shell">
        <aside class="admin-sidebar" id="admin-sidebar" aria-label="Menú del panel"></aside>
        <div class="admin-overlay" id="admin-overlay" hidden></div>
        <div class="admin-main">
            <header class="admin-topbar">
                <button type="button" class="admin-icon-button admin-menu-toggle" id="admin-menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="admin-sidebar"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
                <h1 id="admin-title">Auditoría</h1>
                <div class="admin-user" id="admin-user"></div>
            </header>
            <main class="admin-content" id="admin-content">
                <section class="admin-card admin-toolbar" aria-label="Filtrar el registro">
                    <div class="admin-toolbar__filters">
                        <label class="admin-select">Acción<select id="filter-action"><option value="">Todas</option></select></label>
                        <label class="admin-select">Entidad<select id="filter-entity"><option value="">Todas</option></select></label>
                        <label class="admin-select">Administrador<select id="filter-actor"><option value="">Todos</option></select></label>
                        <label class="admin-select">Desde<input type="date" id="filter-from"></label>
                        <label class="admin-select">Hasta<input type="date" id="filter-to"></label>
                    </div>
                </section>

                <div class="admin-alert" id="audit-alert" role="alert" hidden>
                    <span id="audit-alert-text"></span>
                    <button type="button" class="admin-button" id="audit-retry">Reintentar</button>
                </div>

                <section class="admin-card admin-card--flush" aria-labelledby="audit-heading">
                    <div class="admin-card__head admin-card__head--padded">
                        <div><h2 id="audit-heading">Registro de acciones</h2><p id="audit-count" aria-live="polite">Cargando registro…</p></div>
                    </div>
                    <div class="admin-table-wrap">
                        <table class="admin-table admin-table--audit">
                            <thead>
                                <tr>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Administrador</th>
                                    <th scope="col">Acción</th>
                                    <th scope="col">Entidad</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="audit-body"><tr><td colspan="5"><span class="skeleton"></span></td></tr></tbody>
                        </table>
                    </div>
                    <nav class="admin-pagination" aria-label="Paginación" id="audit-pagination" hidden></nav>
                </section>
            </main>
        </div>
    </div>
    <script src="js/admin.js"></script>
    <script src="js/audit.js"></script>
</body>
</html>
