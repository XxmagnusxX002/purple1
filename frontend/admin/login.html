<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso administrativo | Purple One</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <main class="admin-login">
        <section class="admin-login__card" aria-labelledby="admin-login-title">
            <a class="admin-brand" href="../index.html"><span class="admin-brand__logo">PURPLE1</span><span class="admin-brand__tag">Admin</span></a>
            <h1 id="admin-login-title">Acceso administrativo</h1>
            <p>Ingresa con tu cuenta del equipo de Purple One para gestionar la tienda y los pronósticos.</p>
            <p class="admin-login__error" id="admin-login-error" role="alert" hidden></p>
            <form id="admin-login-form" novalidate>
                <label class="admin-field">Correo electrónico
                    <input type="email" name="email" id="admin-email" autocomplete="username" required>
                </label>
                <label class="admin-field">Contraseña
                    <input type="password" name="password" id="admin-password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn-primary admin-login__submit" id="admin-login-submit">Ingresar al panel</button>
            </form>
            <a class="admin-login__back" href="../index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver a la tienda</a>
        </section>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
