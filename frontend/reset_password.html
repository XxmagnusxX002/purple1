<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Purple One | Nueva contraseña</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <main class="auth-page"><div class="wrapper"><section class="card">
        <a href="auth.html" class="logo auth-logo"><div class="logo-box">P1</div><span>Volver al acceso</span></a>
        <form><h1 class="heading">NUEVA CONTRASEÑA</h1>
            <div class="field"><label for="new-password">Nueva contraseña</label><div class="input-wrap"><input type="password" id="new-password" required minlength="8" autocomplete="new-password"></div></div>
            <div class="field"><label for="password-confirm">Confirma la contraseña</label><div class="input-wrap"><input type="password" id="password-confirm" required minlength="8" autocomplete="new-password"></div></div>
            <button class="btn-primary auth-btn" type="submit">ACTUALIZAR CONTRASEÑA</button>
        </form>
    </section><section class="hero"><div class="season-badge"><span class="dot"></span>Seguridad Purple One</div><h2 class="hero-title"><span class="line1">VUELVE A LA PISTA</span></h2></section></div></main>
    <script src="js/reset_password.js"></script>
</body>
</html>
