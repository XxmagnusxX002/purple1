<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple One | Recuperar contraseña</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/fx.css">
</head>
<body class="auth-body">
    <div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <main class="auth-page"><div class="wrapper"><section class="card">
        <a href="auth.html" class="logo auth-logo"><div class="logo-box">P1</div><span>Volver al acceso</span></a>
        <form><h1 class="heading">RECUPERA TU ACCESO</h1>
            <p class="subheading">Te enviaremos un enlace temporal a tu correo electrónico.</p>
            <div class="field"><label for="identifier">Correo electrónico</label><div class="input-wrap"><span class="ico">@</span><input type="email" id="identifier" name="identifier" autocomplete="email" required placeholder="piloto@purpleone.com"></div></div>
            <button class="btn-primary auth-btn" type="submit">ENVIAR ENLACE</button>
        </form>
    </section><section class="hero"><div class="season-badge"><span class="dot"></span>Seguridad Purple One</div><h2 class="hero-title"><span class="line1">VUELVE A LA PISTA</span></h2></section></div></main>
    <script src="js/navbar.js"></script><script src="js/forgot_password.js"></script><script src="js/fx.js"></script>
</body>
</html>
