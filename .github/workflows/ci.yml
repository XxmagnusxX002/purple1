name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Revisar que el back compile
        run: python -m compileall -q backend main.py
      - name: Revisar la configuración de despliegue
        run: |
          python -c "import json; json.load(open('vercel.json'))"
      - name: Revisar que no se suba la copia de la base
        run: test ! -f database/purple1_completo.sql
